databaseChangeLog:
  - changeSet:
      id: 001-create-employees
      author: salary-management
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: employees
      changes:
        - sqlFile:
            path: 001-create-employees.sql
            relativeToChangelogFile: true

  - changeSet:
      id: 002-seed-employees
      author: salary-management
      changes:
        - sqlFile:
            path: 002-seed-employees.sql
            relativeToChangelogFile: true
