spring.application.name=salary-management
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/salary_management}
spring.datasource.username=${DATABASE_USER:salary_app}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
