spring:
  application:
    name: salary-management
  datasource:
    url: "${DATABASE_URL:jdbc:postgresql://localhost:5432/salary_management}"
    username: "${DATABASE_USER:salary_app}"
    password: "${DATABASE_PASSWORD:}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  address: "${SERVER_ADDRESS:127.0.0.1}"
  port: "${PORT:8080}"
